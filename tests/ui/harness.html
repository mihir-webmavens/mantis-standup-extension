<!doctype html>
<!-- Stand-in Mantis page for the UI tests. Served at https://projects.webmavens.dev/<path>
     by the test driver, it runs the real content.js with a fake `chrome` API.
     Query options:
       n=<count>     number of EODs (odd ones filled)     allfilled=1  every EOD filled
       dup=<count>   same-day standups for ticket 123     prio=<level> ticket shows this priority
       err=1         EOD list fails (logged out)          saveerr=1    saving an EOD fails
       heading=<text> the ticket shows "#<id> <text>" above it, like Mantis
       header=1      a Mantis-like header bar             ai=<mode>    MantisAI helper: reply (default) | slow | error | setup |
                                                                        lookup (reads a ticket) | approve (asks to resolve it) | noauth -->
<html>
<head><meta charset="utf-8"><title>Mantis</title><link rel="stylesheet" href="/mantis-header.css"></head>
<body style="margin:0;height:100vh;background:#f9fafb;font-family:sans-serif">
  <script>
    if (new URLSearchParams(location.search).get('header')) {
      document.write(`<header style="display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;background:#fff;border-bottom:1px solid #eee">
        <a href="/">Mantis</a>
        <nav data-flux-navbar><a href="https://projects.webmavens.dev/tickets">Tickets</a><a href="https://projects.webmavens.dev/my-work">My Work</a><a href="https://projects.webmavens.dev/chat">Chat</a><a href="https://projects.webmavens.dev/tickets?unassigned=1">Unassigned</a><a href="https://projects.webmavens.dev/todos">Todos</a><a href="https://projects.webmavens.dev/notifications">Notifications</a><ui-dropdown><button type="button">GitHub</button><ui-menu><a href="https://projects.webmavens.dev/github/activity">Activity</a></ui-menu></ui-dropdown></nav>
        <div><ui-dropdown><button type="button" aria-label="Switch project">All projects</button></ui-dropdown></div>
        <div class="right" style="display:flex;align-items:center;gap:8px"><span>Bell</span><span class="avatar">MS</span></div></header>`);
    }
  </script>
  <main><h1 style="padding:20px;margin:0">Mantis page</h1><p>Ticket body: the login page loops.</p></main>
  <script>
    const q = new URLSearchParams(location.search);
    // Like Mantis: the number and the title in separate elements above the ticket.
    if (q.get('heading')) document.querySelector('main').insertAdjacentHTML('afterbegin', `<div><div><h2><span style="color:#999">#${location.pathname.split('/').pop()}</span> ${q.get('heading')}</h2><p>Project · Created by anu</p></div></div>`);
    if (q.get('prio')) document.body.insertAdjacentHTML('beforeend', `<div><span>Priority</span><span>${q.get('prio')}</span></div>`);

    const pad = (n) => String(n).padStart(2, '0');
    const day = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const today = day(new Date());
    const eods = Array.from({ length: Number(q.get('n') ?? 3) }, (_, i) => ({
      id: String(10000 + i), ticket: String(8380 + i), link: `https://projects.webmavens.dev/tickets/${8380 + i}`,
      plannedAction: `Planned action ${i}`, priority: ['Low', 'Medium', 'High'][i % 3], estTime: '-',
      createdAt: `${today} 10:0${i % 10}:00`, update: i % 2 ? `Done <b>${i}</b> & shipped` : '',
    }));
    if (q.get('allfilled')) eods.forEach((e) => { e.update = e.update || 'done'; });
    for (let i = 0; i < Number(q.get('dup') || 0); i++) {
      eods.push({ id: `2000${i}`, ticket: '123', link: 'https://projects.webmavens.dev/tickets/123', plannedAction: `Investigating the login redirect loop on staging that happens after the session times out (${i})`, priority: 'High', estTime: '2h', createdAt: `${today} 0${9 + i}:1${i}:00`, update: '' });
    }
    if (q.get('dup')) {
      eods.push({ id: '19999', ticket: '123', link: 'https://projects.webmavens.dev/tickets/123', plannedAction: 'Yesterday', priority: 'High', estTime: '-', createdAt: `${day(new Date(Date.now() - 864e5))} 10:00:00`, update: 'done' });
      eods.push({ id: '19998', ticket: '1234', link: 'https://github.com/acme/app/issues/123', plannedAction: 'Other ticket', priority: 'Low', estTime: '-', createdAt: `${today} 11:00:00`, update: '' });
    }

    // What the tests can inspect.
    window.T = {
      sent: [], payloads: [], leaked: 0, onMessage: null,
      root: () => document.querySelector('mantis-quick-standup').shadowRoot,
      ai: () => document.querySelector('mantis-ai').shadowRoot,
      aiPorts: [], local: {},
      wait: (ms) => new Promise((r) => setTimeout(r, ms)),
      // Synthetic key event on the focused element inside the extension UI.
      key: (key, init = {}) => (T.root().activeElement || document.body).dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, composed: true, cancelable: true, ...init })),
      // Sends a message the way background.js relays a keyboard shortcut.
      shortcut: (command) => new Promise((resolve) => T.onMessage({ type: 'shortcut', command }, {}, resolve)),
    };
    document.addEventListener('keydown', () => T.leaked++); // stands in for Mantis's own shortcuts

    // Chrome already defines window.chrome on pages (writable, not configurable); replace it.
    window.chrome = {
      storage: {
        sync: { get: async () => ({}) },
        local: { get: async (key) => structuredClone({ [key]: T.local[key] }), set: async (items) => { Object.assign(T.local, structuredClone(items)); } },
        onChanged: { addListener() {} },
      },
      runtime: {
        // The MantisAI port to background.js; the helper's behaviour comes from ?ai=.
        connect: ({ name }) => {
          const listeners = { message: [], disconnect: [] };
          const port = {
            name, sent: [], disconnected: false,
            onMessage: { addListener: (f) => listeners.message.push(f) },
            onDisconnect: { addListener: (f) => listeners.disconnect.push(f) },
            disconnect: () => { port.disconnected = true; },
            postMessage: async (msg) => {
              port.sent.push(structuredClone(msg));
              const reply = (m) => { if (!port.disconnected) listeners.message.forEach((f) => f(m)); };
              if (msg.type === 'approve') return port.onApprove?.(msg);
              const mode = q.get('ai') || 'reply';
              await T.wait(30);
              if (mode === 'noauth') reply({ type: 'mantis', status: 'needs-auth' });
              if (mode === 'lookup' || mode === 'approve') {
                reply({ type: 'session', sessionId: '11111111-2222-4333-8444-555555555555' });
                reply({ type: 'mantis', status: 'connected' });
                reply({ type: 'tool', id: 'toolu_1', tool: 'tickets', input: { action: 'get', ticket_id: 123 } });
                await T.wait(30);
                reply({ type: 'tool_result', id: 'toolu_1', isError: false });
                if (mode === 'approve') {
                  reply({ type: 'delta', text: 'I will resolve it.' });
                  reply({ type: 'tool', id: 'toolu_2', tool: 'tickets', input: { action: 'change_status', ticket_id: 123, status_key: 'resolved' } });
                  reply({ type: 'approval', id: 7, toolUseId: 'toolu_2', tool: 'tickets', input: { action: 'change_status', ticket_id: 123, status_key: 'resolved' } });
                  const { allow } = await new Promise((resolve) => { port.onApprove = resolve; });
                  reply({ type: 'tool_result', id: 'toolu_2', isError: !allow });
                  reply({ type: 'delta', text: allow ? ' Done.' : ' Left it open.' });
                }
                return reply({ type: 'done', sessionId: '11111111-2222-4333-8444-555555555555', text: '' });
              }
              if (mode === 'setup') return reply({ type: 'error', code: 'not-installed', error: 'The MantisAI helper is not installed on this computer.' });
              if (mode === 'error') return reply({ type: 'error', code: 'auth', error: 'The Claude CLI is not logged in. Run `claude` in a terminal, log in, then try again.' });
              reply({ type: 'session', sessionId: msg.sessionId || '11111111-2222-4333-8444-555555555555' });
              await T.wait(mode === 'slow' ? 400 : 30);
              const pieces = ['Here is **the plan**:\n\n', '1. Fix `login`\n2. Ship it\n\n', '```js\nconst a = "<b>";\n```'];
              for (const text of pieces) { reply({ type: 'delta', text }); await T.wait(mode === 'slow' ? 300 : 10); }
              reply({ type: 'done', sessionId: msg.sessionId || '11111111-2222-4333-8444-555555555555', text: pieces.join('') });
            },
          };
          T.aiPorts.push(port);
          return port;
        },
        onMessage: { addListener: (f) => { T.onMessage = f; } },
        sendMessage: async ({ type, payload }) => {
          T.sent.push(type);
          T.payloads.push(payload);
          await T.wait(30);
          if (type === 'fetchEods') {
            return q.get('err')
              ? { ok: false, error: 'You are not logged into standup.webmavens.dev. Log in at https://standup.webmavens.dev/login, then try again.' }
              : { ok: true, eods: structuredClone(eods) };
          }
          if (type === 'submitStandup') return { ok: true };
          if (type === 'updateEod') {
            await T.wait(100);
            if (q.get('saveerr')) return { ok: false, error: 'Standup session expired. Reload standup.webmavens.dev and try again.' };
            eods.find((e) => e.id === payload.id).update = payload.update.replace(/\s+/g, ' ').trim();
            return { ok: true, eods: structuredClone(eods) };
          }
        },
      },
    };
  </script>
  <script src="/button-styles.js"></script>
  <script src="/mantis-ai.js"></script>
  <script src="/content.js"></script>
</body>
</html>
